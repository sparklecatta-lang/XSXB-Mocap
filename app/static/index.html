<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSXB MOCAP</title>
<meta name="application-name" content="XSXB MOCAP">
<meta name="theme-color" content="#F5F1E8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23002FA7'/%3E%3Cpath d='M10 10l12 12M22 10L10 22' stroke='%23F5F1E8' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#F5F1E8;--card:#FFFDF8;--sunk:#EFE9DC;--line:#E2DACA;--line2:#D3C9B4;
  --fg:#1E1C18;--fg2:#3F3B33;--mut:#6A6458;
  --acc:#002FA7;--acc-h:#00238A;--acc-a:#001C6E;--acc-t:#E3E8F4;--acc-ring:rgba(0,47,167,.22);
  --ok:#1F7A45;--ok-t:#E3F0E6;--warn:#8A5A00;--warn-t:#F6EBD2;--err:#B3261E;--err-t:#F7E1DE;
  --r:10px;--r-lg:14px;
  --sh:0 1px 2px rgba(40,32,16,.05),0 2px 8px rgba(40,32,16,.04);
  --sh-up:0 -6px 24px rgba(40,32,16,.10);
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;overflow-x:hidden}
::selection{background:var(--acc);color:#fff}
a{color:var(--acc);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline;text-underline-offset:2px}
.mut{color:var(--mut)} .warn{color:var(--warn)} .err{color:var(--err)} .ok{color:var(--ok)}
.sp{flex:1}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 24px;background:rgba(245,241,232,.92);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--acc)}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
header h1 b{color:var(--acc)}
header .tag{font-size:13px;color:var(--mut);padding-left:14px;border-left:1px solid var(--line2)}
header .tools{display:flex;gap:8px}

/* layout */
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:20px 24px;max-width:1320px;margin:0 auto 140px}
aside .card{position:sticky;top:76px}
main{min-width:0}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px}
  aside .card{position:static}
  header{padding:10px 16px} header .tag{display:none}
}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:15px;font-weight:700;margin:0}
aside h2.cap{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
@media (max-width:560px){.card{padding:16px}}

/* hero: what happens now */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;border-left:4px solid var(--acc);padding:16px 20px}
.hero .ht{flex:1 1 280px;min-width:0}
.hero h3{margin:0;font-size:16px;font-weight:700}
.hero .hs{margin-top:4px;color:var(--fg2);font-size:13px;line-height:1.6}
.hero .ha{display:flex;flex-wrap:wrap;gap:8px}
.hero.err{background:var(--err-t);border-color:#E9C2BC;border-left-color:var(--err)}
.hero.err h3{color:var(--err)}
.hero.warn{background:var(--warn-t);border-color:#E8D6AE;border-left-color:var(--warn)}
.hero.ok{border-left-color:var(--ok)}
.hero .emsg{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg2);max-height:120px;overflow:auto}
.hero ul{margin:6px 0 0;padding-left:18px}

/* stages */
.sh{display:flex;align-items:center;gap:10px;min-width:0}
.sh h2{min-width:0}
.num{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);color:var(--mut);background:var(--card);font-size:12px;font-weight:700}
.stage.active .num{border-color:var(--acc);color:var(--acc)}
.stage.done .num{background:var(--acc);border-color:var(--acc);color:#fff}
.stage .body{margin:10px 0 0 34px}
.stage .hint{font-size:13px;line-height:1.6;color:var(--mut);max-width:78ch;margin:0 0 10px}
@media (max-width:560px){.stage .body,.stage .adv{margin-left:0}}
.pill{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--mut);white-space:nowrap}
.pill.done{background:var(--acc-t);color:var(--acc)}
.pill.run{background:var(--acc);color:#fff}
.pill.queue{background:var(--sunk);color:var(--fg2)}
.pill.err{background:var(--err-t);color:var(--err)}
.pill.block{background:var(--warn-t);color:var(--warn)}
.pill.run i,.dot.run{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sum{font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.sum b{color:var(--fg)}
.wlist{font-size:13px;color:var(--warn);margin-top:6px}

/* drop zones */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line2);border-radius:var(--r-lg);background:var(--bg);padding:22px 16px;cursor:pointer;color:var(--fg2);font-size:13px;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--acc);background:var(--acc-t)}
.drop .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc-t);color:var(--acc);margin-bottom:4px}
.drop:hover .ic{background:var(--acc);color:#fff}
.drop b{font-size:15px;color:var(--fg)}
.drop small{color:var(--mut);font-size:12px}
.drop.big{padding:64px 24px;background:var(--card)}
.drop.big b{font-size:20px}
.drop.big .ic{width:60px;height:60px}
.drop.sm{padding:14px 10px;gap:2px}
.drop.sm b{font-size:13px}
.drop.sm .ic{width:28px;height:28px}
#dragOv{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(0,47,167,.92);color:#F5F1E8;pointer-events:none;text-align:center}
#dragOv.on{display:grid}
#dragOv .box{border:2px dashed rgba(245,241,232,.6);border-radius:24px;padding:48px 40px;max-width:560px}
#dragOv b{display:block;font-size:26px;letter-spacing:.04em;margin-bottom:10px}
#dragOv .sub{font-size:14px;line-height:1.8;opacity:.9}

/* rows, fields, buttons */
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:8px 0}
label{cursor:pointer;color:var(--fg2);font-size:13px;display:inline-flex;align-items:center;gap:6px}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;margin:0}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:13px;font-weight:600;line-height:1.2;padding:8px 14px;min-height:34px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled),.btn:hover{border-color:var(--acc);color:var(--acc);text-decoration:none}
button:active:not(:disabled),.btn:active{transform:translateY(1px)}
button.pri,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover:not(:disabled),.btn.pri:hover{background:var(--acc-h);border-color:var(--acc-h);color:#fff}
button.danger{color:var(--err);border-color:#E3C6C1;background:transparent}
button.danger:hover:not(:disabled){background:var(--err-t);border-color:var(--err);color:var(--err)}
button.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
button.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent;color:var(--fg)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible,.drop:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acc-ring)}
input,select,textarea{font:inherit;font-size:13px;padding:7px 10px;min-height:34px;border-radius:var(--r);border:1px solid var(--line2);background:#FFFEFB;color:var(--fg);max-width:100%}
input:hover,select:hover,textarea:hover{border-color:#BFB49C}
input[type=number]{width:96px;font-variant-numeric:tabular-nums}
input[type=checkbox]{min-height:0;padding:0}
textarea{width:100%;min-height:340px;font:12px/1.5 var(--mono);background:var(--sunk);resize:vertical}

/* project list */
.plist{display:flex;flex-direction:column;gap:2px}
.plist a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);color:var(--fg2);font-weight:500;text-decoration:none;border-left:3px solid transparent}
.plist a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist a:hover{background:var(--sunk);color:var(--fg)}
.plist a.sel{background:var(--acc-t);color:var(--acc);font-weight:700;border-left-color:var(--acc)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;color:var(--acc)}
.dot.err{background:var(--err)}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.exl{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.exl a{padding:5px 8px;border-radius:8px;font-size:13px}
.exl a:hover{background:var(--sunk);text-decoration:none}

/* advanced (collapsed) */
details>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--acc);border-radius:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
.adv{margin:12px 0 0 34px}
.adv>summary{color:var(--mut);font-size:12px}
.adv>summary:hover{color:var(--fg)}
.advb{margin-top:8px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.advb .sub{font-size:13px;color:var(--mut);margin:4px 0}
.advb hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* media */
img.thumb{display:block;max-width:100%;max-height:380px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk)}
video{display:block;max-width:100%;max-height:560px;margin-top:8px;border-radius:var(--r);background:#14130F}
.vid{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px 14px;margin-top:12px}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vh b{font-size:14px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--mut)}
.chip.done{background:var(--acc-t);color:var(--acc)}
.chip.run{background:var(--acc);color:#fff}
.chip.err{background:var(--err-t);color:var(--err)}
.vid .adv{margin-left:0}
.cap{font-size:12px;color:var(--mut);margin-top:8px}

/* toasts */
#toasts{position:fixed;top:68px;right:16px;z-index:40;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:var(--r);padding:10px 12px;box-shadow:0 6px 24px rgba(40,32,16,.12);font-size:13px;overflow-wrap:anywhere}
.toast.err{border-left-color:var(--err)} .toast.ok{border-left-color:var(--ok)}
.tbar{height:4px;background:var(--sunk);border-radius:99px;margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}

/* bottom job strip */
#job{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:var(--sh-up);padding:10px 24px 12px;z-index:6}
#job>*{max-width:1272px;margin-left:auto;margin-right:auto}
.jrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.jrow button{min-height:30px;padding:5px 12px}
#jobTitle{font-size:14px;overflow-wrap:anywhere}
#jobStage{font-size:13px;color:var(--mut);overflow-wrap:anywhere;min-width:0}
#jobPct{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
.spin{display:none;flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--acc-t);border-top-color:var(--acc);animation:spin .9s linear infinite}
#job.active .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#job .bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
#job .bar div{height:100%;background:var(--acc);width:0;border-radius:99px;transition:width .4s}
#log{display:block;height:170px;overflow:auto;background:#1C1B17;color:#E9E3D4;padding:10px 12px;border-radius:var(--r);font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;margin-bottom:0}
@media (max-width:820px){#job{padding:10px 16px}#log{height:120px}}
</style>
</head>

  <div class="brand">
    <span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#F5F1E8" stroke-width="2.4" stroke-linecap="round"/></svg></span>

  </div>
  <span class="tag" data-t="tagline"></span><span class="sp"></span>

<div id="job" hidden>

  <pre id="log" hidden></pre>
</div>
<div id="toasts"></div>
<div id="dragOv"><div class="box"><b data-t="dropTitle"></b><div class="sub" id="dragSub"></div></div></div>
<input type="file" id="picker" multiple hidden>

async function api(path,opt={}){

function kind(title){
  if(/^(import_rig|prep)$/.test(title))return{s:1,step:"prep"};
  if(title==="start_frame")return{s:2,step:"start_frame"};
  if(/^(build|render|train)$/.test(title))return{s:3,step:"build"};
  const m=String(title).match(/^(detect_fit|preview|export)_(.+)$/);if(m)return{s:4,step:m[1],v:m[2]};

}
const titleOf=k=>k.v?`${k.step}_${k.v}`:k.step;
const keyOf=k=>`${k.step}:${k.v||""}`;
const label=k=>t("k_"+k.step)+(k.v?` · ${k.v}`:"");

const buildBody=S=>({samples:S.render_samples||1500,workers:3,steps:S.train_steps||6000});
function nextStep(S){
  if(!S.prepped)return S.source?{step:"prep"}:null;
  if(!S.config||S.config_error||(S.config_warnings||[]).length)return{block:"cfg"};
  if(!S.start_frame)return{step:"start_frame"};
  if(!S.model)return{step:"build",body:buildBody(S)};
  for(const v of S.videos||[]){
    if(!v.fitted)return{step:"detect_fit",v:v.id,body:{mode:"ours"}};
    if(!v.fbx||!v.blend)return{step:"export",v:v.id};
    if(!v.compare)return{step:"preview",v:v.id};
  }
  return null;
}
function launch(p,k){return post(k.v?`/api/projects/${p}/videos/${k.v}/run/${k.step}`:`/api/projects/${p}/run/${k.step}`,k.body).then(r=>r.job)}
function fail(p,k,error,id){ST.auto[p]=false;errs[p]={...kind(titleOf(k)),error,id};save()}
function armAuto(p){ST.auto[p]=true;delete errs[p];delete doneKeys[p];save()}

async function autopilot(){
  if(piloting||!settings||!settings.blender)return;piloting=true;
  try{for(const S of projects){const p=S.name;
    if(!ST.auto[p]||S.busy||runOf(p)||ST.inflight[p])continue;
    let k=(ST.tasks[p]||[])[0],isTask=!!k;
    if(!k){k=nextStep(S);if(!k||k.block)continue;
      if(doneKeys[p]&&doneKeys[p].has(keyOf(k))){fail(p,k,t("noOutput"));continue}}
    try{const id=await launch(p,k);ST.inflight[p]={id,task:isTask,key:keyOf(k)};seen[id]="queued";S.busy=true;
      jobs.unshift({id,project:p,title:titleOf(k),status:"queued",progress:0,stage:"",stage_index:0,stages:1,elapsed:0})}
    catch(e){fail(p,k,e.message)}
    save()}}finally{piloting=false}
}
function handleEnd(j){
  const p=j.project,inf=ST.inflight[p],k=kind(j.title);
  if(inf&&inf.id===j.id){delete ST.inflight[p];
    if(j.status==="done"){if(inf.task)(ST.tasks[p]||[]).shift();else(doneKeys[p]=doneKeys[p]||new Set()).add(inf.key)}
    else if(j.status==="cancelled"&&inf.task)(ST.tasks[p]||[]).shift()}
  if(j.status!=="done"){ST.auto[p]=false;errs[p]={...k,error:j.status==="cancelled"?t("cancelled"):j.error,id:j.id}}
  else if(errs[p]&&errs[p].step===k.step)delete errs[p];
  lastEnded=j.id;save();
}
let polling=false;
async function pollJobs(init){
  if(polling)return;polling=true;
  try{let js;try{js=await api("/api/jobs")}catch(e){return}
    jobs=js;let changed=false;
    for(const j of js){const prev=seen[j.id];
      if(prev===undefined){seen[j.id]=j.status;if(!init){changed=true;if(!ACTIVE(j.status))handleEnd(j)}}
      else if(prev!==j.status){seen[j.id]=j.status;changed=true;if(ACTIVE(prev)&&!ACTIVE(j.status))handleEnd(j)}}
    for(const p in ST.inflight)if(!js.find(j=>j.id===ST.inflight[p].id)){delete ST.inflight[p];save();changed=true}
    if(changed&&!init)await refresh();else updatePanel();
  }finally{polling=false}
}
async function refresh(){
  try{projects=await api("/api/projects")}catch(e){return}
  if(!projects.find(p=>p.name===cur))setCur(projects.length?projects[0].name:"");
  await autopilot();render();updatePanel();
}

function toast(msg,bar,cls){const d=document.createElement("div");d.className="toast "+(cls||"");
  d.innerHTML=`<div>${esc(msg)}</div>${bar?'<div class="tbar"><i></i></div>':""}`;$("#toasts").append(d);
  const o={set:x=>{const i=d.querySelector("i");if(i)i.style.width=(x*100)+"%"},close:()=>d.remove()};
  if(!bar)setTimeout(o.close,cls==="err"?7000:3500);return o}
function upload(url,file,extra={}){return new Promise((res,rej)=>{
  const fd=new FormData();fd.append("file",file);for(const k in extra)fd.append(k,extra[k]);
  const x=new XMLHttpRequest(),tt=toast(t("uploading")+file.name,true);
  x.upload.onprogress=e=>{if(e.lengthComputable)tt.set(e.loaded/e.total)};
  x.onload=()=>{tt.close();let j=null;try{j=JSON.parse(x.responseText)}catch(e){}
    x.status>=200&&x.status<300?res(j):rej(new Error((j&&j.detail)||x.statusText))};
  x.onerror=()=>{tt.close();rej(new Error("network error"))};x.open("POST",url);x.send(fd)})}
function uniqueName(stem){
  let s=stem.replace(/[^A-Za-z0-9_\-]+/g,"_").replace(/^[^A-Za-z0-9]+/,"").replace(/_+$/,"").slice(0,40)||"rig";
  const names=new Set(projects.map(p=>p.name));let n=s,k=2;while(names.has(n))n=`${s}_${k++}`;return n}
async function importRig(file,into,regen){
  let p=into;
  if(!p){const S=projects.find(x=>x.name===cur);
    if(S&&!S.source&&!S.prepped&&!runOf(S.name))p=S.name;
    else{p=uniqueName(file.name.replace(/\.[^.]+$/,""));await post("/api/projects",{name:p});projects.push({name:p,videos:[]})}}
  setCur(p);
  const r=await upload(`/api/projects/${p}/rig`,file,{reset_config:regen?"1":"0"});
  armAuto(p);if(r&&r.job)seen[r.job]="queued";
}
async function handleFiles(list){
  const fs=[...list],isRig=x=>RIG_EXT.includes(ext(x.name));
  const rigs=fs.filter(isRig),vids=fs.filter(x=>!isRig(x)&&(VID_EXT.includes(ext(x.name))||(x.type||"").startsWith("video/")));
  fs.filter(x=>!rigs.includes(x)&&!vids.includes(x)).forEach(x=>toast(t("badFile")+x.name,false,"err"));
  try{for(const x of rigs)await importRig(x);
    if(vids.length){
      if(!projects.find(p=>p.name===cur))toast(t("needProj"),false,"err");
      else{for(const x of vids)await upload(`/api/projects/${cur}/videos`,x);armAuto(cur);toast(`${t("uploaded")} · ${vids.length}`,false,"ok")}}
  }catch(e){toast(e.message,false,"err")}
  await refresh();
}
function pick(accept,cb){const el=$("#picker");el.accept=accept;
  el.onchange=()=>{const fs=[...el.files];el.value="";if(fs.length)(cb||handleFiles)(fs)};el.click()}
let dragDepth=0;const hasFiles=e=>[...((e.dataTransfer&&e.dataTransfer.types)||[])].includes("Files");
addEventListener("dragenter",e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;

function hero(S,run,n){

    `<button class="pri" data-act="continue">${t("retry")}</button>${e.id?`<button data-act="log" data-id="${e.id}">${t("log")}</button>`:""}`);

      ${dl}
      ${v.compare?`<div class="cap">${t("compare")}</div><video controls loop muted preload="metadata" src="${f(`videos/${v.id}/fit/compare.mp4`)}"></video>`
        :`<video controls loop muted preload="metadata" src="${f(`videos/${v.id}/source.mp4`)}" style="max-height:360px"></video>`}
      ${rep}
      <details class="adv" id="advv_${esc(v.id)}"><summary>${t("adv")}</summary><div class="advb">
        ${v.overlay?`<details id="ovl_${esc(v.id)}"><summary>${t("overlay")}</summary><video controls loop muted preload="metadata" src="${f(`videos/${v.id}/det/overlay.mp4`)}"></video></details><hr>`:""}
        <div class="row"><label>${t("mode")} <select class="vmode"><option value="ours">${t("ours")}</option><option value="triangulate">${t("tri")}</option></select></label>
        <button data-act="refit" data-v="${esc(v.id)}" ${S.model&&S.start_frame?"":"disabled"}>${t("refit")}</button>
        <button class="danger" data-act="delVid" data-v="${esc(v.id)}" ${busy?"disabled":""}>${t("del")}</button></div></div></details></div>`}).join("");
  const b4=`<div class="drop" data-act="pickVid" tabindex="0"><span class="ic">${ICON_VID}</span><b>${t("vidDrop")}</b><small>${t("vidDropSub")}</small></div>
    ${vids.length&&!S.model?`<p class="hint" style="margin-top:10px">${t("vidWait")}</p>`:""}${vc}`;
  h+=stage(4,t("st4"),st(4,vids.length&&vids.every(vdone),S.model&&vids.length),S.prepped?b4:"",null);
  h+=projAdv;
  m.innerHTML=h;
  open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});
  const det=$("#cfgDet"),ta=$("#cfgText");
  if(det){ta.oninput=()=>cfgDraft=ta.value;
    det.ontoggle=async()=>{if(det.open&&!ta.value){ta.value=cfgDraft??(await api(`/api/projects/${cur}/config`)).text}}}
}

/* ---------- job strip ---------- */
function panelJobPick(){
  const by=id=>id&&!closed.has(id)&&jobs.find(j=>j.id===id);
  return by(panelJob)||jobs.find(j=>ACTIVE(j.status)&&j.project===cur)||jobs.find(j=>ACTIVE(j.status))||by(lastEnded)||null;
}
async function updatePanel(){
  const j=panelJobPick(),box=$("#job");
  document.querySelectorAll("[data-pct]").forEach(el=>{const r=jobs.find(x=>x.id===el.dataset.pct);if(r)el.textContent=r.status==="queued"?t("queued"):Math.round(r.progress*100)+"%"});
  if(!j){box.hidden=true;return}
  box.hidden=false;
  if(logFor!==j.id){logFor=j.id;logNext=0;$("#log").textContent=""}
  const act=ACTIVE(j.status);box.classList.toggle("active",act);
  $("#jobTitle").textContent=`${j.project} · ${label(kind(j.title))}`;
  $("#jobStage").textContent=act?(j.stage?`${j.stage} (${j.stage_index+1}/${j.stages}) · ${fmt(j.elapsed)}`:""):(j.status==="done"?fmt(j.elapsed):(j.error||""));
  $("#jobPct").innerHTML=j.status==="done"?`<span class="ok">${t("jobDone")}</span>`:act?(j.status==="queued"?t("queued"):`${(j.progress*100).toFixed(1)}%`):`<span class="err">${t("jobErr")}</span>`;
  $("#jobBar").style.width=(j.status==="done"?100:j.progress*100)+"%";
  $("#jobCancel").hidden=!act;$("#jobClose").hidden=act;
  $("#log").hidden=!logOpen;$("#jobLog").textContent=logOpen?t("hideLog"):t("log");
  if(logOpen){try{const d=await api(`/api/jobs/${j.id}?since=${logNext}`);if(logFor!==j.id)return;logNext=d.next;
    if(d.lines.length){const lg=$("#log"),stick=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-20;lg.textContent+=d.lines.join("\n")+"\n";
      if(lg.textContent.length>200000)lg.textContent=lg.textContent.slice(-150000);if(stick)lg.scrollTop=lg.scrollHeight}}catch(e){}}
}
$("#jobLog").onclick=()=>{logOpen=!logOpen;updatePanel()};
$("#jobCancel").onclick=()=>{const j=panelJobPick();if(j)post(`/api/jobs/${j.id}/cancel`).catch(e=>toast(e.message,false,"err"))};
$("#jobClose").onclick=()=>{const j=panelJobPick();if(j)closed.add(j.id);if(panelJob===(j&&j.id))panelJob=null;logOpen=false;updatePanel()};

/* ---------- actions ---------- */
function pushTask(p,k){(ST.tasks[p]=ST.tasks[p]||[]).push(k);armAuto(p);save()}
document.addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();d.click()}});
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");if(!a||a.disabled)return;
  if(a.tagName==="A")e.preventDefault();
  const act=a.dataset.act,p=cur,S=projects.find(x=>x.name===p);
  try{switch(act){
    case "lang":L=L==="zh"?"en":"zh";try{localStorage.setItem("qm_lang",L)}catch(_){}applyLang();render();updatePanel();break;
    case "setBlender":{const v=prompt(t("blender"),(settings&&settings.blender)||"");if(v===null)return;settings=await post("/api/settings",{blender:v});await refresh();break}
    case "proj":setCur(a.dataset.p);render();updatePanel();refresh();break;
    case "example":{const name=uniqueName(a.dataset.x),r=await post("/api/projects",{name,example:a.dataset.x});setCur(name);armAuto(name);if(r.job)seen[r.job]="queued";await refresh();break}
    case "pickRig":pick(RIG_EXT.join(","));break;
    case "pickVid":pick("video/*,"+VID_EXT.join(","));break;
    case "continue":armAuto(p);await refresh();break;
    case "log":panelJob=a.dataset.id;closed.delete(panelJob);logOpen=true;updatePanel();break;
    case "openCfg":{const ad=$("#adv1"),cd=$("#cfgDet");if(ad)ad.open=true;if(cd){cd.open=true;cd.scrollIntoView({behavior:"smooth",block:"start"})}break}
    case "reimport":{const regen=!!($("#regen")&&$("#regen").checked);
      pick(RIG_EXT.join(","),async fs=>{try{await importRig(fs[0],p,regen)}catch(err){toast(err.message,false,"err")}await refresh()});break}
    case "reprep":pushTask(p,{step:"prep"});await refresh();break;
    case "redoSf":pushTask(p,{step:"start_frame"});await refresh();break;
    case "retrain":pushTask(p,{step:"build",body:{samples:+$("#nSamp").value,workers:+$("#nWork").value,steps:+$("#nSteps").value,reuse_data:!!($("#reuse")&&$("#reuse").checked)}});await refresh();break;
    case "refit":{const v=a.dataset.v,mode=a.closest(".vid").querySelector(".vmode").value;
      pushTask(p,{step:"detect_fit",v,body:{mode}});pushTask(p,{step:"export",v});pushTask(p,{step:"preview",v});await refresh();break}
    case "delVid":{const v=a.dataset.v;if(!confirm(t("confirmDel")+" "+v))return;
      await api(`/api/projects/${p}/videos/${v}`,{method:"DELETE"});ST.tasks[p]=(ST.tasks[p]||[]).filter(k=>k.v!==v);save();await refresh();break}
    case "delProj":if(!confirm(t("confirmDel")+" "+p))return;
      await api(`/api/projects/${p}`,{method:"DELETE"});delete ST.auto[p];delete ST.tasks[p];delete ST.inflight[p];delete errs[p];save();setCur("");await refresh();break;
    case "cfgSave":{const ta=$("#cfgText");
      try{const r=await api(`/api/projects/${p}/config`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:ta.value})});
        cfgDraft=null;$("#cfgMsg").innerHTML=r.warnings.length?`<span class="warn">${r.warnings.map(esc).join("<br>")}</span>`:`<span class="ok">${t("saved")}</span>`;
        if(!r.warnings.length)setTimeout(refresh,600)}
      catch(err){$("#cfgMsg").innerHTML=`<span class="err">${esc(err.message)}</span>`}break}
  }}catch(err){toast(err.message,false,"err")}
});

(async()=>{applyLang();
  try{settings=await api("/api/settings")}catch(e){settings={blender:"",examples:[]}}
  await pollJobs(true);await refresh();setInterval(()=>pollJobs(false),1200)})();
</script>
</body>
</html>
